<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Broker Portal — Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 80px auto; }
    a { color: #0a5; }
  </style>
</head>
<body>
  <h1 id="welcome-heading">Loading...</h1>
  <p>This is where an advisor's active loan/client cases would appear.</p>
  <a id="logout-link" href="index.html">Sign out</a>

  <script>
    const user = localStorage.getItem('brokerPortalUser');
    document.getElementById('welcome-heading').textContent = user
      ? 'Welcome back, ' + user
      : 'Welcome — no active session';

    document.getElementById('logout-link').addEventListener('click', function () {
      localStorage.removeItem('brokerPortalUser');
    });
  </script>
</body>
</html>
